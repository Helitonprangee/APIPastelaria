services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comandas_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15

  api-comandas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-comandas
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "4443:4443/tcp"
      - "4443:4443/udp"
    volumes:
      - ./cert:/cert:ro
    env_file:
      - ./src/.env

volumes:
  mysql_data: